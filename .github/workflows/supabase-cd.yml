name: Deploy Backend (Supabase)

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**' # Only trigger when backend files actually change

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never kill a running `db push` halfway through a migration; queue instead.
  cancel-in-progress: false

jobs:
  db-tests:
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: "dummy-client-id"
      SUPABASE_AUTH_GOOGLE_SECRET: "dummy-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  deploy:
    needs: db-tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: "dummy-client-id"
      SUPABASE_AUTH_GOOGLE_SECRET: "dummy-secret"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.192.0

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Database Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
