project_id = "classhub"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://classhub.vercel.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[functions.send-critical-announcement]
verify_jwt = true

[functions.nudge-unacknowledged]
verify_jwt = true

[functions.send-assignment-reminders]
verify_jwt = true

[functions.send-custom-notification]
enabled = true
verify_jwt = true
import_map = "./functions/send-custom-notification/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-custom-notification/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-custom-notification/*.html" ]
